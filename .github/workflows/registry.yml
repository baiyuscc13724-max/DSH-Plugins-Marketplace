name: build-registry

on:
  schedule:
    # 每 2 小时更新一次索引（UTC；即北京时间每偶数点整）
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --check scripts/build-registry.mjs
          node --check lib/index.js
          node --check lib/client.js

      - name: Build registry.json
        run: node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if git diff --cached --quiet; then
            echo "registry.json 无变化，跳过提交"
          else
            git commit -m "chore: update registry.json"
            git push
            echo "已提交更新"
          fi
